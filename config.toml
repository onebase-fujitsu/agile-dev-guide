baseURL = 'https://onebase-fujitsu.github.io/agile-dev-guide/'
hasCJKLanguage = true
theme = "book"
defaultContentLanguage = 'ja'

[languages]
    [languages.ja]
        languageCode = 'ja'
        languageName = '日本語'
        title = 'Fujitsu Agile Development Guide'
        weight = 1
    [languages.en]
        languageCode = 'en'
        languageName = 'English'
        title = 'Fujitsu Agile Development Guide'
        weight = 2

[params]
    BookTheme = 'light'
    BookSearch = false

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
